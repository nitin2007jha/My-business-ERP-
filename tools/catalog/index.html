<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f7a80"><title>Catalog Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#0f7a80;--ink:#10262a;--mut:#5d7276;--bg:#f2f6f5;--cd:#fff;--ln:#dde7e6;--ac:#f2a007}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3,.pr{font-family:'Bricolage Grotesque',Figtree,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--c);color:#fff;font-weight:700}
button.g{background:transparent;color:var(--c);border:1px solid var(--c)}button.d{background:#d64545}button:disabled{opacity:.5}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--c);color:#fff}.top h1{font-size:18px;flex:1;line-height:1.2}.top a{color:#fff;text-decoration:none;font-size:22px}.top small{color:#fffc}
.wrap{padding:12px;max-width:900px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:100px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 3px}label.tg{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}label.tg input{width:18px;height:18px}
nav.bn{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bn button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:11px;padding:8px 2px}nav.bn button.on{color:var(--c)}nav.bn b{display:block;font-size:19px}
.rw{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:12px;margin-bottom:6px;background:var(--cd)}.rw.on{border-color:var(--c)}
.rw img,.rw i{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--c);flex:none}
.rw div{flex:1;min-width:0}.rw h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--mut);font-size:12px}.rw input[type=checkbox]{width:20px;height:20px;accent-color:var(--c);flex:none}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);padding:0 12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:1;background:var(--bg);display:grid;place-items:center;position:relative}.im img{width:100%;height:100%;object-fit:cover}.im i{font:800 40px 'Bricolage Grotesque';color:var(--c)}
.bd,.of{position:absolute;left:6px;font-size:11px;padding:2px 8px;border-radius:99px}.bd{top:6px;background:var(--ac);color:#231700}.of{bottom:6px;background:#16a34a;color:#fff}
.hs{position:absolute;right:6px;top:6px;padding:3px 9px;background:#fff;color:#d64545;border-radius:99px}
.b2{padding:9px;display:flex;flex-direction:column;gap:2px;flex:1}.b2 h3{font-size:14px;line-height:1.25}.pr{font-size:17px;font-weight:800}.pr s{font:400 12px Figtree;color:var(--mut);margin-left:6px}
.ad{margin-top:auto;padding:8px}.out{opacity:.55}.lo{color:#d97706}
.hero{padding:14px;color:#fff;background:var(--c)}.hero .lg{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain}.hero h2{font-size:22px}.ban{width:100%;max-height:170px;object-fit:cover;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;align-items:center}.chips button{white-space:nowrap;background:var(--cd);color:var(--ink);border:1px solid var(--ln);padding:6px 12px;border-radius:99px}.chips button.on{background:var(--c);color:#fff}.chips select{width:auto}
.t-classic .cd{border-radius:3px;border:2px solid var(--ink)}.t-minimal .cd{border:0;background:transparent}.t-minimal .im{border-radius:14px}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--cd);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;justify-content:space-between;padding:14px 16px;box-shadow:0 8px 24px #0004}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#10262a;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;z-index:50;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.em{text-align:center;padding:60px 20px;color:var(--mut)}.q{display:flex;gap:6px;align-items:center}.q button{padding:4px 10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(var(--cols,3),1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="m"></div><div id="toast"></div>

<script type="module">

// ⚠ Main index.html jaisa hi config + appId rakhein (same origin par login automatically share hota hai)
const CFG={apiKey:"AIzaSyCV3G-BMVf2QRpibaS5MnwQybKixC4h9og",authDomain:"dev-ayurveda.firebaseapp.com",projectId:"dev-ayurveda",storageBucket:"dev-ayurveda.firebasestorage.app",messagingSenderId:"40760282698",appId:"1:40760282698:web:20e31100eed712631ca0b3"};
const APP=typeof __app_id!=='undefined'?__app_id:'dev-ayurveda-pro-auth';
const fb=initializeApp(typeof __firebase_config!=='undefined'?JSON.parse(__firebase_config):CFG),auth=getAuth(fb),db=getFirestore(fb);
/* Customer-side Firebase app: named app => its own auth storage, so a customer/test visit can NEVER replace the owner's ERP login */
let _sa=null;const storeFb=async()=>{if(!_sa){const a=initializeApp(typeof __firebase_config!=='undefined'?JSON.parse(__firebase_config):CFG,'store');_sa={auth:getAuth(a),db:getFirestore(a)}}if(!_sa.auth.currentUser)await signInAnonymously(_sa.auth);return _sa};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const D=(...a)=>doc(db,'artifacts',APP,...a),Co=(...a)=>collection(db,'artifacts',APP,...a);
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)};
const S={tab:'pick',q:'',cat:'',sort:'name',sf:'',view:'list',prods:[],list:[],st:{},web:{},cur:null,save:'✓ Saved'};
const qs=new URLSearchParams(location.search),pubId=qs.get('c'),C=()=>S.cur,link=()=>location.origin+location.pathname+'?c='+C().id;
const SW=['#0f7a80','#2874f0','#e53935','#8a5d80','#e65100','#3d6e6a','#111827'];
const biz=()=>({name:S.st.businessName||'My Business',logo:S.st.logo||'',phone:S.st.phone||S.st.mobile||'',addr:S.st.address||''});
const NEW=()=>({id:'c'+Date.now().toString(36),title:'Product Catalog',tag:'',color:S.web.themeColor||'#0f7a80',cols:3,tpl:'modern',pdf:'cards',banner:'',wa:S.web.whatsappNumber||'',note:'',valid:'',disc:0,mrp:1,gst:0,stock:1,hsn:0,sel:[],ov:{},coupons:'',pub:0,upd:Date.now()});
const vm=(p,c)=>{const o=c.ov[p.id]||{},b=Number(p.rate)||0;return{id:p.id,name:p.name,cat:p.category||'',price:o.price!==''&&o.price!=null?+o.price:Math.round(b*(1-(+c.disc||0)/100)),mrp:Math.max(+p.mrp||0,b),gst:+p.gst||0,hsn:p.hsn||'',stock:p.stock??null,desc:o.desc||p.description||'',img:p.productImage||'',badge:o.badge||'',feat:o.feat?1:0}};
const sel=()=>{const c=C();return S.prods.filter(p=>c.sel.includes(p.id)).map(p=>vm(p,c))};
/* ---------- shared storefront ---------- */
const cardH=(v,c,pb)=>{const off=v.mrp>v.price?Math.round(100-v.price*100/v.mrp):0,out=c.stock&&v.stock!=null&&v.stock<=0;
return`<article class="cd${out?' out':''}" ${pb?`onclick="pd('${v.id}')"`:''}><div class=im>${v.img?`<img loading=lazy src="${v.img}">`:`<i>${esc((v.name||'?')[0])}</i>`}${v.badge?`<b class=bd>${esc(v.badge)}</b>`:''}${off?`<b class=of>${off}% off</b>`:''}${pb?`<button class=hs onclick="event.stopPropagation();wl('${v.id}')">${W.has(v.id)?'♥':'♡'}</button>`:''}</div><div class=b2><h3>${esc(v.name)}</h3><small>${esc(v.cat)}${c.hsn&&v.hsn?' · HSN '+esc(v.hsn):''}</small><div class=pr>${inr(v.price)}${c.mrp&&off?`<s>${inr(v.mrp)}</s>`:''}</div>${c.gst&&v.gst?`<small>+${v.gst}% GST</small>`:''}${c.stock&&v.stock!=null?`<small class="${v.stock<=5?'lo':''}">${out?'Out of stock':v.stock<=5?'Only '+v.stock+' left':'In stock'}</small>`:''}${pb&&!out?`<button class=ad onclick="event.stopPropagation();add('${v.id}')">Add to cart</button>`:''}</div></article>`};
const store=()=>{const{c,biz:b}=G;G.cats=[...new Set(G.items.map(i=>i.cat).filter(Boolean))];
return`<div class="t-${c.tpl}" style="--cols:${c.cols};--c:${esc(c.color)}"><div class=hero><div class=q>${b.logo?`<img class=lg src="${b.logo}">`:''}<div style="flex:1"><h2>${esc(b.name||c.title)}</h2><small>${esc(c.title)}${c.tag?' · '+esc(c.tag):''}</small></div><button class=g style="color:#fff;border-color:#fff8" onclick="dk()">◐</button></div><input style="margin-top:10px" placeholder="Search products…" oninput="F.q=this.value;sg()"></div>${c.banner?`<img class=ban src="${esc(c.banner)}">`:''}<div class=chips><button class=on onclick="fc(this,-1)">All</button>${G.pub?'<button onclick="fc(this,-2)">♥ Saved</button>':''}${G.cats.map((x,i)=>`<button onclick="fc(this,${i})">${esc(x)}</button>`).join('')}<select onchange="F.sort=this.value;sg()"><option value=feat>Featured</option><option value=lo>Price ↑</option><option value=hi>Price ↓</option><option value=az>A–Z</option></select></div><div id=sg class=grid></div>${c.note?`<p class=em style="padding:24px 14px"><small>${esc(c.note)}</small></p>`:''}</div>`};
const sg=()=>{const q=F.q.toLowerCase();let a=G.items.filter(i=>(F.cat=='__w'?W.has(i.id):!F.cat||i.cat===F.cat)&&(!q||(i.name+i.cat).toLowerCase().includes(q)));const s=F.sort;a.sort((x,y)=>s=='lo'?x.price-y.price:s=='hi'?y.price-x.price:s=='az'?x.name.localeCompare(y.name):y.feat-x.feat);$('#sg').innerHTML=a.map(i=>cardH(i,G.c,G.pub)).join('')||'<p class=em style="grid-column:1/-1">Koi product nahi mila</p>'};
const fc=(b,i)=>{F.cat=i==-1?'':i==-2?'__w':G.cats[i];b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));sg()};
const dk=()=>{localStorage.dk=document.documentElement.toggleAttribute('data-d')?1:''};
const wl=id=>{W.has(id)?W.delete(id):W.add(id);try{localStorage.wl=JSON.stringify([...W])}catch{}sg()};
const cm=()=>$('#m').innerHTML='';
/* ---------- public: cart + order ---------- */
const cs=()=>{try{localStorage['ct_'+G.c.id]=JSON.stringify(cart)}catch{}};
const tot=()=>{const it=Object.entries(cart).map(([id,q])=>[G.items.find(i=>i.id===id),q]).filter(x=>x[0]);let sub=0,g=0;it.forEach(([i,q])=>{sub+=i.price*q;if(G.c.gst)g+=i.price*q*i.gst/100});const cp=(G.c.coupons||'').split('\n').map(l=>l.split(':')).find(a=>a[0]&&a[0].trim().toUpperCase()==(window.cpn||'').toUpperCase()&&window.cpn),pc=cp?+cp[1]||0:0,ds=sub*pc/100,gs=g*(1-pc/100);return{it,sub,ds,gst:gs,total:Math.round(sub-ds+gs)}};
const cb=()=>{const n=Object.values(cart).reduce((a,b)=>a+b,0);let b=$('#fab');if(!b){b=document.createElement('button');b.id='fab';b.className='fab';b.onclick=cartOpen;document.body.append(b)}b.style.display=n?'flex':'none';b.innerHTML=`<span>${n} item${n>1?'s':''}</span><span>${inr(tot().sub)} · View cart</span>`};
const add=id=>{cart[id]=(cart[id]||0)+1;cs();cb();toast('Cart me add ho gaya')};
const qt=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];cs();cb();Object.keys(cart).length?cartOpen():cm()};
const cartOpen=()=>{const t=tot(),u=JSON.parse(localStorage.cust||'{}');$('#m').innerHTML=`<div class=modal onclick="if(event.target==this)cm()"><div class=sheet><h2>Your cart</h2>${t.it.map(([i,q])=>`<div class=rw><div><h3>${esc(i.name)}</h3><small>${inr(i.price)} each</small></div><div class=q><button class=g onclick="qt('${i.id}',-1)">−</button>${q}<button class=g onclick="qt('${i.id}',1)">+</button></div></div>`).join('')}<div class=row style="margin:8px 0"><input id=cc placeholder="Coupon code" value="${esc(window.cpn||'')}"><button class=g onclick="cpn=$('#cc').value.trim();cartOpen()">Apply</button></div><p>Subtotal ${inr(t.sub)}${t.ds?`<br>Coupon −${inr(t.ds)}`:''}${t.gst?`<br>GST ${inr(t.gst)}`:''}</p><h2>Total ${inr(t.total)}</h2><label>Name</label><input id=cnm value="${esc(u.n||'')}"><label>Phone</label><input id=cph type=tel value="${esc(u.p||'')}"><label>Address</label><textarea id=cad rows=2>${esc(u.a||'')}</textarea><button style="width:100%;margin-top:12px" onclick="order()">Order on WhatsApp</button></div></div>`};
const order=async()=>{if(order.busy)return;const t=tot(),n=$('#cnm').value.trim(),p=$('#cph').value.trim(),a=$('#cad').value.trim();
if(!n||!p)return toast('Naam aur phone daalein');if(p.replace(/\D/g,'').length<8)return toast('Sahi phone number daalein');
if(!t.it.length)return toast('Cart khali hai');const w=(G.c.wa||'').replace(/\D/g,'');if(!w)return toast('Seller ka WhatsApp number set nahi hai');
try{localStorage.cust=JSON.stringify({n,p,a})}catch{}
order.busy=1;toast('Order save ho raha hai…');
const oid='WO'+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(2,4).toUpperCase(),bn=G.biz.name||G.c.title,qty=t.it.reduce((x,[,q])=>x+q,0);
const erp=location.origin+location.pathname.replace(/tools\/catalog\/?(index\.html)?$/,'')+'?action=web-orders';
let saved=false;
try{const{db:sdb,auth:sa}=await storeFb();
await setDoc(doc(sdb,'artifacts',APP,'users',G.c.ownerUid,'onlineOrders',oid),{customerName:n.slice(0,80),customerPhone:p.slice(0,20),customerAddress:a.slice(0,400),
items:t.it.map(([i,q])=>({productId:i.id,name:String(i.name).slice(0,120),qty:q,rate:+(i.price*(G.c.gst?1+(i.gst||0)/100:1)).toFixed(2),gst:i.gst||0})),
subtotal:Math.round(t.sub),discount:Math.round(t.ds||0),couponCode:t.ds?String(window.cpn||'').slice(0,30):'',gst:Math.round(t.gst||0),total:t.total,
status:'pending',paymentMethod:'cod',source:'catalog',catalogId:G.c.id,customerUid:sa.currentUser.uid,createdAt:Date.now()});saved=true}catch(e){console.warn('order save failed',e)}
let m;
if(saved){m=`*New order #${oid}* — ${bn}\n\n${qty} item${qty>1?'s':''} · *Total: ${inr(t.total)}*\n\nName: ${n}\nPhone: ${p}\nAddress: ${a}\n\nOrder audit karne ke liye kholein:\n${erp}`;cart={};cs();cb();cm();toast('Order #'+oid+' bhej diya ✓')}
else{/* fallback: never lose an order - send the full item list on WhatsApp */
m=`*New order — ${bn}*\n\n`+t.it.map(([i,q],k)=>`${k+1}. ${i.name} × ${q} = ${inr(i.price*q)}`).join('\n')+`\n\nSubtotal: ${inr(t.sub)}`+(t.ds?`\nCoupon (${cpn}): -${inr(t.ds)}`:'')+(t.gst?`\nGST: ${inr(t.gst)}`:'')+`\n*Total: ${inr(t.total)}*\n\nName: ${n}\nPhone: ${p}\nAddress: ${a}`;toast('Online save nahi hua, full message bhej rahe hain')}
order.busy=0;open('https://wa.me/'+w+'?text='+encodeURIComponent(m),'_blank')};
const pd=id=>{const i=G.items.find(x=>x.id==id),out=G.c.stock&&i.stock!=null&&i.stock<=0;$('#m').innerHTML=`<div class=modal onclick="if(event.target==this)cm()"><div class=sheet>${i.img?`<img src="${i.img}" style="width:100%;border-radius:14px;max-height:320px;object-fit:cover">`:''}<h2 style="margin-top:10px">${esc(i.name)}</h2><small>${esc(i.cat)}</small><div class=pr style="font-size:24px">${inr(i.price)}${i.mrp>i.price?`<s>${inr(i.mrp)}</s>`:''}</div><p style="margin:8px 0;white-space:pre-line">${esc(i.desc)}</p><div class=row><button class=g onclick="spd('${id}')">Share</button>${out?'':`<button onclick="add('${id}');cm()">Add to cart</button>`}</div></div></div>`};
const spd=id=>{const u=location.origin+location.pathname+'?c='+G.c.id+'&p='+id;navigator.share?navigator.share({title:G.c.title,url:u}).catch(()=>{}):(navigator.clipboard.writeText(u),toast('Link copied'))};
const pubMode=async id=>{document.body.style.paddingBottom='90px';try{/* FIX: no signInAnonymously here - it overwrote the owner's login (same origin shares auth). Catalog read rule is public. */const s=await getDoc(D('catalogs',id));if(!s.exists())return $('#app').innerHTML='<p class=em>Ye catalog available nahi hai.</p>';const c=s.data();if(c.valid&&new Date(c.valid+'T23:59:59')<new Date())return $('#app').innerHTML=`<p class=em>Ye catalog ${esc(c.valid)} ko expire ho chuka hai.</p>`;
const it=await getDocs(Co('catalogs',id,'items'));G={c:{...c,id},items:it.docs.map(d=>d.data()),biz:c.biz||{},pub:1};W=new Set(JSON.parse(localStorage.wl||'[]'));try{cart=JSON.parse(localStorage['ct_'+id]||'{}')}catch{}
document.title=c.title+' — '+(c.biz&&c.biz.name||'');document.documentElement.style.setProperty('--c',c.color);$('#app').innerHTML=store();sg();cb();if(qs.get('p')&&G.items.some(x=>x.id==qs.get('p')))pd(qs.get('p'))}catch(e){$('#app').innerHTML=`<p class=em>Catalog load nahi hua (${esc(e.message)})</p>`}};
/* ---------- owner: state ---------- */
const hd=()=>{const e=$('#cnt');if(e)e.textContent=C().sel.length+' selected'};
const saveNow=async()=>{try{await setDoc(D('users',S.user.uid,'catalogs',C().id),C());const i=S.list.findIndex(x=>x.id==C().id);i<0?S.list.push(C()):S.list[i]=C();S.save='✓ Saved'}catch(e){S.save='⚠ Not saved'}const s=$('#sv');if(s)s.textContent=S.save};
const dirty=()=>{C().upd=Date.now();const s=$('#sv');if(s)s.textContent='Saving…';clearTimeout(dirty.t);dirty.t=setTimeout(saveNow,900)};
const set=el=>{const k=el.dataset.k;C()[k]=el.type=='checkbox'?+el.checked:(el.type=='number'||k=='cols')?+el.value||0:el.value;dirty()};
const sc=x=>{C().color=x;dirty();render()};
const tab=t=>{S.tab=t;render();scrollTo(0,0)};
const filt=()=>{const q=S.q.toLowerCase(),c=C();return S.prods.filter(p=>(!q||((p.name||'')+(p.category||'')).toLowerCase().includes(q))&&(!S.cat||p.category===S.cat)&&(S.sf!='in'||p.stock>0)&&(S.sf!='low'||(p.stock>0&&p.stock<=(p.lowStockAlert||10)))&&(S.sf!='sel'||c.sel.includes(p.id))).sort((a,b)=>S.sort=='pl'?a.rate-b.rate:S.sort=='ph'?b.rate-a.rate:S.sort=='st'?(a.stock||0)-(b.stock||0):(a.name||'').localeCompare(b.name||''))};
const tg=id=>{const s=C().sel,i=s.indexOf(id);i<0?s.push(id):s.splice(i,1);dirty();pl()};
const selAll=()=>{const s=C().sel;filt().forEach(p=>s.includes(p.id)||s.push(p.id));dirty();pl()};
const selIn=()=>{const s=C().sel;filt().filter(p=>p.stock>0).forEach(p=>s.includes(p.id)||s.push(p.id));dirty();pl()};
const clr=()=>{C().sel=[];dirty();pl()};
const ed=id=>{const p=S.prods.find(x=>x.id==id),o=C().ov[id]||{};$('#m').innerHTML=`<div class=modal onclick="if(event.target==this)cm()"><div class=sheet><h2>${esc(p.name)}</h2><small>Base ${inr(p.rate)} · MRP ${inr(p.mrp)}</small><label>Catalog price (khali = auto)</label><input id=e1 type=number value="${o.price??''}"><label>Badge</label><select id=e2>${['','New','Hot','Sale','Bestseller','Limited'].map(b=>`<option ${o.badge==b?'selected':''}>${b}</option>`).join('')}</select><label>Description</label><textarea id=e3 rows=3>${esc(o.desc||p.description||'')}</textarea><label class=tg><input id=e4 type=checkbox ${o.feat?'checked':''}>Featured (sabse upar dikhao)</label><div class=row style="margin-top:12px"><button class=g onclick="cm()">Cancel</button><button onclick="es('${id}')">Save</button></div></div></div>`};
const es=id=>{C().ov[id]={price:$('#e1').value,badge:$('#e2').value,desc:$('#e3').value,feat:$('#e4').checked};dirty();cm();pl()};
const nw=()=>{S.cur=NEW();S.list.push(S.cur);S.tab='design';saveNow();render()};
const ld=id=>{S.cur=S.list.find(x=>x.id==id);S.tab='pick';render()};
const dup=id=>{const c=JSON.parse(JSON.stringify(S.list.find(x=>x.id==id)));c.id='c'+Date.now().toString(36);c.title+=' (copy)';c.pub=0;S.cur=c;S.list.push(c);saveNow();S.tab='design';render()};
const wipe=async id=>{const ex=await getDocs(Co('catalogs',id,'items')),b=writeBatch(db);ex.docs.forEach(d=>b.delete(d.ref));b.delete(D('catalogs',id));await b.commit()};
const del=async id=>{if(!confirm('Ye catalog delete karein?'))return;try{await wipe(id).catch(()=>{});await deleteDoc(D('users',S.user.uid,'catalogs',id));S.list=S.list.filter(x=>x.id!=id);if(!S.list.length){S.list.push(NEW());saveNow()}if(C().id==id)S.cur=S.list[0];render()}catch(e){toast(e.message)}};
/* ---------- owner: publish / share / export ---------- */
const pub=async()=>{const c=C(),v=sel();if(!v.length)return toast('Kam se kam 1 product select karein');S.busy=1;render();
try{const cfg={ownerUid:S.user.uid,title:c.title,tag:c.tag,color:c.color,cols:c.cols,tpl:c.tpl,banner:c.banner,wa:c.wa,note:c.note,valid:c.valid,mrp:c.mrp,gst:c.gst,stock:c.stock,hsn:c.hsn,coupons:c.coupons,biz:biz(),n:v.length,updatedAt:new Date().toISOString()};
const ex=await getDocs(Co('catalogs',c.id,'items')),keep=new Set(v.map(x=>x.id));let b=writeBatch(db),n=1;b.set(D('catalogs',c.id),cfg);
for(const x of v){b.set(D('catalogs',c.id,'items',x.id),x);if(++n>=400){await b.commit();b=writeBatch(db);n=0}}
for(const d of ex.docs)if(!keep.has(d.id)){b.delete(d.ref);if(++n>=400){await b.commit();b=writeBatch(db);n=0}}
await b.commit();c.pub=1;c.pubAt=cfg.updatedAt;await saveNow();toast('Published ✓')}catch(e){toast('Publish fail: '+e.message)}S.busy=0;render()};
const unp=async()=>{try{await wipe(C().id);C().pub=0;await saveNow();toast('Unpublished');render()}catch(e){toast(e.message)}};
const cp=()=>{navigator.clipboard.writeText(link());toast('Link copied')};
const wa=()=>open('https://wa.me/?text='+encodeURIComponent(C().title+' — '+biz().name+'\n'+link()));
const nsh=()=>navigator.share?navigator.share({title:C().title,url:link()}).catch(()=>{}):cp();
const qr=()=>{const e=$('#qr');if(e&&C().pub&&window.QRCode)new QRCode(e,{text:link(),width:160,height:160})};
const csv=()=>{const r=[['Name','Category','HSN','Price','MRP','GST%','Stock']].concat(sel().map(v=>[v.name,v.cat,v.hsn,v.price,v.mrp,v.gst,v.stock??'']));const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r.map(x=>x.map(y=>'"'+String(y).replace(/"/g,'""')+'"').join(',')).join('\n'));a.download=(C().title||'catalog')+'.csv';a.click()};
const pdfH=(c,v)=>{const b=biz(),td='padding:6px;text-align:left',pr=x=>`<b>${inr(x.price)}</b>${c.mrp&&x.mrp>x.price?` <s style="color:#999;font-size:10px">${inr(x.mrp)}</s>`:''}`;
const h=`<div style="display:flex;gap:12px;align-items:center;border-bottom:3px solid ${esc(c.color)};padding-bottom:12px;margin-bottom:14px;font-family:Arial">${b.logo?`<img src="${b.logo}" style="width:48px;height:48px;object-fit:contain">`:''}<div><div style="font-size:20px;font-weight:800">${esc(b.name)}</div><div style="font-size:12px;color:#555">${esc(c.title)}${c.tag?' — '+esc(c.tag):''}</div><div style="font-size:11px;color:#777">${esc(b.phone)} ${esc(b.addr)}${c.valid?' · Valid till '+esc(c.valid):''}</div></div></div>`;
const body=c.pdf=='table'?`<table style="width:100%;border-collapse:collapse;font:12px Arial"><tr style="background:${esc(c.color)};color:#fff">${['#','Product','Category','Price'].map(x=>`<th style="${td}">${x}</th>`).join('')}</tr>${v.map((x,i)=>`<tr style="border-bottom:1px solid #ddd;break-inside:avoid"><td style="${td}">${i+1}</td><td style="${td}">${esc(x.name)}</td><td style="${td}">${esc(x.cat)}</td><td style="${td}">${pr(x)}${c.gst&&x.gst?` +${x.gst}% GST`:''}</td></tr>`).join('')}</table>`:`<div style="display:grid;grid-template-columns:repeat(${Math.min(c.cols,3)},1fr);gap:12px;font-family:Arial">${v.map(x=>`<div style="border:1px solid #ddd;border-radius:10px;overflow:hidden;break-inside:avoid">${x.img?`<img src="${x.img}" style="width:100%;height:120px;object-fit:cover">`:'<div style="height:120px;background:#eef3f3"></div>'}<div style="padding:8px"><div style="font-weight:700;font-size:12px">${esc(x.name)}</div><div style="font-size:10px;color:#777">${esc(x.cat)}${c.gst&&x.gst?' · +'+x.gst+'% GST':''}</div><div style="font-size:14px;margin-top:4px">${pr(x)}</div></div></div>`).join('')}</div>`;
return h+body+`<div style="margin-top:16px;font:10px Arial;color:#777;text-align:center">${esc(c.note)}${c.pub?`<br>Order online: ${esc(link())}`:''}</div>`};
const pdf=async()=>{const c=C(),v=sel();if(!v.length)return toast('Pehle products select karein');toast('PDF ban rahi hai…');const d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:700px;opacity:.001;z-index:-1;background:#fff;padding:20px;color:#111';d.innerHTML=pdfH(c,v);document.body.appendChild(d);
try{await html2pdf().set({margin:8,filename:(c.title||'Catalog').replace(/[^a-z0-9\-_]+/gi,'_')+'.pdf',image:{type:'jpeg',quality:.92},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','avoid-all']}}).from(d).save()}catch(e){toast('PDF fail: '+e.message)}d.remove()};
/* ---------- owner: views ---------- */
const pick=()=>{const cats=[...new Set(S.prods.map(p=>p.category).filter(Boolean))].sort(),o=(l,k,a)=>`<select onchange="S.${k}=this.value;pl()">${a.map(x=>`<option value="${x[0]}" ${S[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
return`<div class=box><input placeholder="Search products…" value="${esc(S.q)}" oninput="S.q=this.value;pl()"><div class=row style="margin-top:8px">${o('','cat',[['','All categories'],...cats.map(x=>[x,x])])}${o('','sf',[['','All stock'],['in','In stock'],['low','Low stock'],['sel','Selected']])}${o('','sort',[['name','A–Z'],['pl','Price ↑'],['ph','Price ↓'],['st','Stock']])}</div><div class=row style="margin-top:8px"><button class=g onclick="selAll()">Select all</button><button class=g onclick="selIn()">In-stock only</button><button class=g onclick="clr()">Clear</button><button class=g onclick="S.view=S.view=='list'?'tile':'list';pl()">▦ View</button></div></div><div id=pl></div>`};
const pl=()=>{const a=filt(),c=C(),e=$('#pl');e.className=S.view=='tile'?'grid':'';e.style.setProperty('--cols',3);e.style.padding=0;e.innerHTML=a.map(p=>{const on=c.sel.includes(p.id),v=vm(p,c),th=p.productImage?`<img src="${p.productImage}">`:`<i>${esc((p.name||'?')[0])}</i>`;return S.view=='tile'?`<div class=cd style="${on?'outline:2px solid var(--c)':''}" onclick="tg('${p.id}')"><div class=im>${th}${on?'<b class=of>✓</b>':''}</div><div class=b2><h3>${esc(p.name)}</h3><small>${inr(v.price)}</small></div></div>`:`<div class="rw ${on?'on':''}"><input type=checkbox ${on?'checked':''} onchange="tg('${p.id}')">${th}<div onclick="tg('${p.id}')"><h3>${esc(p.name)}</h3><small>${esc(p.category||'')} · ${inr(v.price)} · stock ${p.stock??'–'}</small></div><button class=g onclick="ed('${p.id}')">✎</button></div>`}).join('')||'<p class=em>Koi product nahi mila</p>';hd()};
const design=()=>{const c=C(),f=(k,l,ty='text')=>`<label>${l}</label><input data-k=${k} type=${ty} value="${esc(c[k])}" oninput="set(this)">`,t=(k,l)=>`<label class=tg><input type=checkbox data-k=${k} ${c[k]?'checked':''} onchange="set(this)">${l}</label>`,s=(k,l,o)=>`<label>${l}</label><select data-k=${k} onchange="set(this)">${o.map(x=>`<option value="${x[0]}" ${c[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
return`<div class=box><h3>Basics</h3>${f('title','Catalog title')}${f('tag','Tagline')}${f('banner','Banner image URL','url')}${f('wa','WhatsApp number (91…)','tel')}${f('valid','Valid till','date')}</div><div class=box><h3>Look</h3><label>Brand colour</label><div class=row>${SW.map(x=>`<button style="background:${x};flex:0 0 36px;min-width:36px;height:36px;padding:0" onclick="sc('${x}')"></button>`).join('')}<input type=color data-k=color value="${c.color}" oninput="set(this)" style="flex:0 0 56px;min-width:56px;padding:2px"></div>${s('tpl','Style',[['modern','Modern'],['classic','Classic'],['minimal','Minimal']])}${s('cols','Columns (desktop & PDF)',[[2,'2'],[3,'3'],[4,'4']])}${s('pdf','PDF layout',[['cards','Cards'],['table','Price-list table']])}</div><div class=box><h3>Pricing & display</h3>${f('disc','Discount on all prices (%)','number')}${t('mrp','MRP strike-through dikhao')}${t('gst','GST extra dikhao')}${t('stock','Stock status dikhao')}${t('hsn','HSN dikhao')}</div><div class=box><h3>Store extras</h3><label>Coupons (ek line me: CODE:percent)</label><textarea rows=3 data-k=coupons oninput="set(this)">${esc(c.coupons)}</textarea><label>Terms / footer note</label><textarea rows=3 data-k=note oninput="set(this)">${esc(c.note)}</textarea></div>`};
const prev=()=>`<div id=pv style="max-width:430px;margin:auto;border:1px solid var(--ln);border-radius:20px;overflow:hidden;background:var(--bg);padding-bottom:12px"></div>`;
const pvr=()=>{G={c:C(),items:sel(),biz:biz(),pub:0};$('#pv').innerHTML=store();sg()};
const share=()=>{const c=C();return`<div class=box><h3>Shareable store link</h3>${c.pub?`<p style="word-break:break-all;margin:8px 0;color:var(--c)">${esc(link())}</p><div id=qr style="width:160px;margin:8px auto"></div><div class=row><button onclick="cp()">Copy link</button><button onclick="wa()">WhatsApp</button><button class=g onclick="nsh()">Share…</button><button class=g onclick="open(link())">Open</button></div>`:`<p class=em style="padding:14px">Abhi publish nahi hua. ${c.sel.length} products ka online store banane ke liye Publish dabayein.</p>`}<div class=row style="margin-top:10px"><button ${S.busy?'disabled':''} onclick="pub()">${S.busy?'Publishing…':c.pub?'Update store':'Publish store'}</button>${c.pub?'<button class=d onclick="unp()">Unpublish</button>':''}</div></div><div class=box><h3>Download</h3><div class=row><button onclick="pdf()">PDF catalog</button><button class=g onclick="csv()">CSV export</button></div></div>`};
const mine=()=>`<button style="width:100%;margin-bottom:10px" onclick="nw()">+ New catalog</button>${S.list.map(c=>`<div class=rw ${c.id==C().id?'style="border-color:var(--c)"':''}><div onclick="ld('${c.id}')"><h3>${esc(c.title)}</h3><small>${c.sel.length} products${c.pub?' · 🟢 live':''}</small></div><button class=g onclick="dup('${c.id}')">⧉</button><button class=d onclick="del('${c.id}')">🗑</button></div>`).join('')}`;
const tabs=[['pick','🛍️','Products'],['design','🎨','Design'],['prev','👁️','Preview'],['share','🔗','Share'],['mine','📚','Catalogs']];
const render=()=>{const c=C();$('#app').innerHTML=`<div class=top><a href="../../index.html">←</a><h1>Catalog Studio<br><small>${esc(c.title)}</small></h1><small id=cnt></small><small id=sv>${S.save}</small></div><div class=wrap>${{pick,design,prev,share,mine}[S.tab]()}</div><nav class=bn>${tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="tab('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`;hd();if(S.tab=='pick')pl();if(S.tab=='prev')pvr();if(S.tab=='share')qr()};
const boot=async u=>{S.user=u;try{const[a,b,p,l]=await Promise.all([getDoc(D('users',u.uid,'config','settings')),getDoc(D('users',u.uid,'config','website')),getDocs(Co('users',u.uid,'products')),getDocs(Co('users',u.uid,'catalogs'))]);S.st=a.data()||{};S.web=b.data()||{};S.prods=p.docs.map(d=>({...d.data(),id:d.id})).filter(x=>x.name&&!x.isHidden&&!x.isDeleted);S.list=l.docs.map(d=>d.data()).sort((x,y)=>y.upd-x.upd);S.cur=S.list[0];
if(!S.cur){S.cur=NEW();S.cur.sel=S.st.catalogProductIds||[];S.cur.title=S.st.catalogTitle||S.cur.title;S.list.push(S.cur);saveNow()}render()}catch(e){$('#app').innerHTML=`<p class=em>Data load nahi hua: ${esc(e.message)}</p>`}};
const gate=()=>$('#app').innerHTML=`<div class=em><h2>Login chahiye</h2><p style="margin:10px 0 18px">Pehle main ERP me login karein, phir yahan wapas aayein.</p><button onclick="location.href='../../index.html'">ERP kholein</button></div>`;
Object.assign(window,{$,S,F:{q:'',cat:'',sort:'feat'},G:null,W:new Set(),cart:{},cpn:'',link,tab,tg,selAll,selIn,clr,ed,es,cm,pl,set,sc,cp,wa,nsh,csv,pdf,pub,unp,nw,ld,dup,del,add,cartOpen,qt,order,pd,spd,wl,dk,fc,sg});
if(localStorage.dk)document.documentElement.setAttribute('data-d','');
if(pubId)pubMode(pubId);else onAuthStateChanged(auth,u=>u&&!u.isAnonymous?boot(u):gate());
</script></body></html>
