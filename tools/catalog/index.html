<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f7a80"><title>Catalog Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#0f7a80;--ink:#10262a;--mut:#5d7276;--bg:#f2f6f5;--cd:#fff;--ln:#dde7e6;--ac:#f2a007}
[data-d]{--ink:#e6f1f0;--mut:#97adb0;--bg:#0c1719;--cd:#132326;--ln:#23393c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3,.pr{font-family:'Bricolage Grotesque',Figtree,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--c);color:#fff;font-weight:700}
button.g{background:transparent;color:var(--c);border:1px solid var(--c)}button.d{background:#d64545}button:disabled{opacity:.5}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--c);color:#fff}.top h1{font-size:18px;flex:1;line-height:1.2}.top a{color:#fff;text-decoration:none;font-size:22px}.top small{color:#fffc}
.wrap{padding:12px;max-width:900px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:100px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 3px}label.tg{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}label.tg input{width:18px;height:18px}
nav.bn{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bn button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:11px;padding:8px 2px}nav.bn button.on{color:var(--c)}nav.bn b{display:block;font-size:19px}
.rw{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:12px;margin-bottom:6px;background:var(--cd)}.rw.on{border-color:var(--c)}
.rw img,.rw i{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--c);flex:none}
.rw div{flex:1;min-width:0}.rw h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--mut);font-size:12px}.rw input[type=checkbox]{width:20px;height:20px;accent-color:var(--c);flex:none}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);padding:0 12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:1;background:var(--bg);display:grid;place-items:center;position:relative}.im img{width:100%;height:100%;object-fit:cover}.im i{font:800 40px 'Bricolage Grotesque';color:var(--c)}
.bd,.of{position:absolute;left:6px;font-size:11px;padding:2px 8px;border-radius:99px}.bd{top:6px;background:var(--ac);color:#231700}.of{bottom:6px;background:#16a34a;color:#fff}
.hs{position:absolute;right:6px;top:6px;padding:3px 9px;background:#fff;color:#d64545;border-radius:99px}
.b2{padding:9px;display:flex;flex-direction:column;gap:2px;flex:1}.b2 h3{font-size:14px;line-height:1.25}.pr{font-size:17px;font-weight:800}.pr s{font:400 12px Figtree;color:var(--mut);margin-left:6px}
.ad{margin-top:auto;padding:8px}.out{opacity:.55}.lo{color:#d97706}
.hero{padding:14px;color:#fff;background:var(--c)}.hero .lg{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain}.hero h2{font-size:22px}.ban{width:100%;max-height:170px;object-fit:cover;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;align-items:center}.chips button{white-space:nowrap;background:var(--cd);color:var(--ink);border:1px solid var(--ln);padding:6px 12px;border-radius:99px}.chips button.on{background:var(--c);color:#fff}.chips select{width:auto}
.t-classic .cd{border-radius:3px;border:2px solid var(--ink)}.t-minimal .cd{border:0;background:transparent}.t-minimal .im{border-radius:14px}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--cd);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;justify-content:space-between;padding:14px 16px;box-shadow:0 8px 24px #0004}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#10262a;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;z-index:50;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.em{text-align:center;padding:60px 20px;color:var(--mut)}.q{display:flex;gap:6px;align-items:center}.q button{padding:4px 10px}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tp button{padding:10px 2px;font-size:12px;line-height:1.3}.tgs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:6px}
@media(min-width:700px){.grid{grid-template-columns:repeat(var(--cols,3),1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="m"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,getDocs,collection,deleteDoc,writeBatch}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
// ⚠ Main index.html jaisa hi config + appId rakhein (same origin par login automatically share hota hai)
const CFG={apiKey:"AIzaSyCV3G-BMVf2QRpibaS5MnwQybKixC4h9og",authDomain:"dev-ayurveda.firebaseapp.com",projectId:"dev-ayurveda",storageBucket:"dev-ayurveda.firebasestorage.app",messagingSenderId:"40760282698",appId:"1:40760282698:web:20e31100eed712631ca0b3"};
const APP=typeof __app_id!=='undefined'?__app_id:'dev-ayurveda-pro-auth';
const fb=initializeApp(typeof __firebase_config!=='undefined'?JSON.parse(__firebase_config):CFG),auth=getAuth(fb),db=getFirestore(fb);
/* Customer-side Firebase app: named app => its own auth storage, so a customer/test visit can NEVER replace the owner's ERP login */
let _sa=null;const storeFb=async()=>{if(!_sa){const a=initializeApp(typeof __firebase_config!=='undefined'?JSON.parse(__firebase_config):CFG,'store');_sa={auth:getAuth(a),db:getFirestore(a)}}if(!_sa.auth.currentUser)await signInAnonymously(_sa.auth);return _sa};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const D=(...a)=>doc(db,'artifacts',APP,...a),Co=(...a)=>collection(db,'artifacts',APP,...a);
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)};
const S={cp:[],tab:'pick',q:'',cat:'',sort:'name',sf:'',view:'list',prods:[],list:[],st:{},web:{},cur:null,save:'✓ Saved'};
const qs=new URLSearchParams(location.search),pubId=qs.get('c'),C=()=>S.cur,link=()=>location.origin+location.pathname+'?c='+C().id;
const SW=['#0f7a80','#2874f0','#e53935','#8a5d80','#e65100','#3d6e6a','#111827'];
const biz=()=>({name:S.st.businessName||'My Business',logo:S.st.logo||'',phone:S.st.phone||S.st.mobile||'',addr:S.st.address||''});
const NEW=()=>({id:'c'+Date.now().toString(36),title:'Product Catalog',tag:S.web.tagline||'',color:S.web.themeColor||'#0f7a80',cols:3,tpl:'modern',pdf:'book',banner:'',wa:S.web.whatsappNumber||'',note:'',valid:'',disc:0,mrp:1,gst:0,stock:1,hsn:0,sel:[],ov:{},coupons:'',pub:0,upd:Date.now()});
const vm=(p,c)=>{const o=c.ov[p.id]||{},b=Number(p.rate)||0;return{id:p.id,name:p.name,cat:p.category||'',price:o.price!==''&&o.price!=null?+o.price:Math.round(b*(1-(+c.disc||0)/100)),mrp:Math.max(+p.mrp||0,b),gst:+p.gst||0,hsn:p.hsn||'',stock:p.stock??null,desc:o.desc||p.description||'',img:p.productImage||'',badge:o.badge||'',feat:o.feat?1:0,pack:o.pack||p.unit||p.packSize||p.pack||'',moq:o.moq||p.moq||'',comp:p.composition||p.salt||'',batch:p.batch||p.batchNo||'',exp:p.expiry||p.expDate||p.expiryDate||'',dur:p.duration||p.serviceDuration||''}};
const sel=()=>{const c=C();return S.prods.filter(p=>c.sel.includes(p.id)).map(p=>vm(p,c))};
/* ---------- shared storefront ---------- */
const cardH=(v,c,pb)=>{const off=v.mrp>v.price?Math.round(100-v.price*100/v.mrp):0,out=c.stock&&v.stock!=null&&v.stock<=0;
return`<article class="cd${out?' out':''}" ${pb?`onclick="pd('${v.id}')"`:''}><div class=im>${v.img?`<img loading=lazy src="${v.img}">`:`<i>${esc((v.name||'?')[0])}</i>`}${v.badge?`<b class=bd>${esc(v.badge)}</b>`:''}${off?`<b class=of>${off}% off</b>`:''}${pb?`<button class=hs onclick="event.stopPropagation();wl('${v.id}')">${W.has(v.id)?'♥':'♡'}</button>`:''}</div><div class=b2><h3>${esc(v.name)}</h3><small>${esc(v.cat)}${c.hsn&&v.hsn?' · HSN '+esc(v.hsn):''}</small><div class=pr>${inr(v.price)}${c.mrp&&off?`<s>${inr(v.mrp)}</s>`:''}</div>${c.gst&&v.gst?`<small>+${v.gst}% GST</small>`:''}${c.stock&&v.stock!=null?`<small class="${v.stock<=5?'lo':''}">${out?'Out of stock':v.stock<=5?'Only '+v.stock+' left':'In stock'}</small>`:''}${pb&&!out?`<button class=ad onclick="event.stopPropagation();add('${v.id}')">Add to cart</button>`:''}</div></article>`};
const store=()=>{const{c,biz:b}=G;G.cats=[...new Set(G.items.map(i=>i.cat).filter(Boolean))];
return`<div class="t-${c.tpl}" style="--cols:${c.cols};--c:${esc(c.color)}"><div class=hero><div class=q>${b.logo?`<img class=lg src="${b.logo}">`:''}<div style="flex:1"><h2>${esc(b.name||c.title)}</h2><small>${esc(c.title)}${c.tag?' · '+esc(c.tag):''}</small></div><button class=g style="color:#fff;border-color:#fff8" onclick="dk()">◐</button></div><input style="margin-top:10px" placeholder="Search products…" oninput="F.q=this.value;sg()"></div>${c.banner?`<img class=ban src="${esc(c.banner)}">`:''}<div class=chips><button class=on onclick="fc(this,-1)">All</button>${G.pub?'<button onclick="fc(this,-2)">♥ Saved</button>':''}${G.cats.map((x,i)=>`<button onclick="fc(this,${i})">${esc(x)}</button>`).join('')}<select onchange="F.sort=this.value;sg()"><option value=feat>Featured</option><option value=lo>Price ↑</option><option value=hi>Price ↓</option><option value=az>A–Z</option></select></div>${G.pub&&c.storeUrl?`<a href="${esc(c.storeUrl)}" style="display:block;margin:0 12px 10px;padding:12px;border-radius:14px;border:1.5px dashed var(--c);color:var(--c);font-weight:700;text-align:center;text-decoration:none">🛒 Poora store dekhein (saare products)</a>`:''}<div id=sg class=grid></div>${c.note?`<p class=em style="padding:24px 14px"><small>${esc(c.note)}</small></p>`:''}</div>`};
const sg=()=>{const q=F.q.toLowerCase();let a=G.items.filter(i=>(F.cat=='__w'?W.has(i.id):!F.cat||i.cat===F.cat)&&(!q||(i.name+i.cat).toLowerCase().includes(q)));const s=F.sort;a.sort((x,y)=>s=='lo'?x.price-y.price:s=='hi'?y.price-x.price:s=='az'?x.name.localeCompare(y.name):y.feat-x.feat);$('#sg').innerHTML=a.map(i=>cardH(i,G.c,G.pub)).join('')||'<p class=em style="grid-column:1/-1">Koi product nahi mila</p>'};
const fc=(b,i)=>{F.cat=i==-1?'':i==-2?'__w':G.cats[i];b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));sg()};
const dk=()=>{localStorage.dk=document.documentElement.toggleAttribute('data-d')?1:''};
const wl=id=>{W.has(id)?W.delete(id):W.add(id);try{localStorage.wl=JSON.stringify([...W])}catch{}sg()};
const cm=()=>$('#m').innerHTML='';
/* ---------- public: cart + order ---------- */
const cs=()=>{try{localStorage['ct_'+G.c.id]=JSON.stringify(cart)}catch{}};
const CPL=()=>G.c.cpns||(G.c.coupons||'').split('\n').map(l=>l.split(':')).filter(a=>a[0]&&+a[1]).map(a=>({code:a[0].trim().toUpperCase(),type:'percent',value:+a[1]}));
const cpc=(code,sub)=>{const c=CPL().find(x=>x.code===String(code).trim().toUpperCase()),n=Date.now();if(!c)return{err:'Ye coupon code sahi nahi hai'};if(c.from&&n<new Date(c.from))return{err:'Ye coupon abhi shuru nahi hua'};if(c.exp&&n>new Date(c.exp+'T23:59:59'))return{err:'Ye coupon expire ho chuka hai'};if(c.limit&&(c.used||0)>=c.limit)return{err:'Is coupon ki limit poori ho chuki hai'};if(c.min&&sub<c.min)return{err:'Is coupon ke liye '+inr(c.min)+' ka order chahiye'};let d=c.type==='flat'?+c.value:sub*(+c.value)/100;if(c.max&&c.type!=='flat')d=Math.min(d,+c.max);return{c,d:Math.min(Math.round(d),sub)}};
const applyC=()=>{const v=$('#cc').value.trim(),r=v?cpc(v,tot().sub):{d:0};if(r.err){toast(r.err);return}window.cpn=v.toUpperCase();if(v)toast('🎉 '+inr(r.d)+' bach gaye!');cartOpen()};
const tot=()=>{const it=Object.entries(cart).map(([id,q])=>[G.items.find(i=>i.id===id),q]).filter(x=>x[0]);let sub=0,g=0;it.forEach(([i,q])=>{sub+=i.price*q;if(G.c.gst)g+=i.price*q*i.gst/100});let r=window.cpn?cpc(window.cpn,sub):null;if(r&&r.err)r=null;const ds=r?r.d:0,gs=sub?g*(1-ds/sub):0;
return{it,sub,ds,gst:gs,total:Math.round(sub-ds+gs)}};
const cb=()=>{const n=Object.values(cart).reduce((a,b)=>a+b,0);let b=$('#fab');if(!b){b=document.createElement('button');b.id='fab';b.className='fab';b.onclick=cartOpen;document.body.append(b)}b.style.display=n?'flex':'none';b.innerHTML=`<span>${n} item${n>1?'s':''}</span><span>${inr(tot().sub)} · View cart</span>`};
const add=id=>{cart[id]=(cart[id]||0)+1;cs();cb();toast('Cart me add ho gaya')};
const qt=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];cs();cb();Object.keys(cart).length?cartOpen():cm()};
const cartOpen=()=>{const t=tot(),u=JSON.parse(localStorage.cust||'{}');$('#m').innerHTML=`<div class=modal onclick="if(event.target==this)cm()"><div class=sheet><h2>Your cart</h2>${t.it.map(([i,q])=>`<div class=rw><div><h3>${esc(i.name)}</h3><small>${inr(i.price)} each</small></div><div class=q><button class=g onclick="qt('${i.id}',-1)">−</button>${q}<button class=g onclick="qt('${i.id}',1)">+</button></div></div>`).join('')}<div class=row style="margin:8px 0"><input id=cc placeholder="Coupon code" value="${esc(window.cpn||'')}"><button class=g onclick="applyC()">Apply</button></div><div class=chips style="padding:0 0 6px">${CPL().filter(x=>!cpc(x.code,t.sub).err).map(x=>`<button onclick="$('#cc').value='${esc(x.code)}';applyC()">${esc(x.code)} · save ${inr(cpc(x.code,t.sub).d)}</button>`).join('')}</div><p>Subtotal ${inr(t.sub)}${t.ds?`<br>Coupon −${inr(t.ds)}`:''}${t.gst?`<br>GST ${inr(t.gst)}`:''}</p><h2>Total ${inr(t.total)}</h2><label>Name</label><input id=cnm value="${esc(u.n||'')}"><label>Phone</label><input id=cph type=tel value="${esc(u.p||'')}"><label>Address</label><textarea id=cad rows=2>${esc(u.a||'')}</textarea><button style="width:100%;margin-top:12px" onclick="order()">Order on WhatsApp</button></div></div>`};
const order=async()=>{if(order.busy)return;const t=tot(),n=$('#cnm').value.trim(),p=$('#cph').value.trim(),a=$('#cad').value.trim();
if(G.c.closed)return toast(G.c.closed);if(G.c.minOrder&&t.sub<G.c.minOrder)return toast('Minimum order '+inr(G.c.minOrder)+' hai');if(!n||!p)return toast('Naam aur phone daalein');if(p.replace(/\D/g,'').length<8)return toast('Sahi phone number daalein');
if(!t.it.length)return toast('Cart khali hai');const w=(G.c.wa||'').replace(/\D/g,'');if(!w)return toast('Seller ka WhatsApp number set nahi hai');
try{localStorage.cust=JSON.stringify({n,p,a})}catch{}
order.busy=1;toast('Order save ho raha hai…');
const oid='WO'+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(2,4).toUpperCase(),bn=G.biz.name||G.c.title,qty=t.it.reduce((x,[,q])=>x+q,0);
const erp=location.origin+location.pathname.replace(/tools\/catalog\/?(index\.html)?$/,'')+'?action=web-orders';
let saved=false;
try{const{db:sdb,auth:sa}=await storeFb();
await setDoc(doc(sdb,'artifacts',APP,'users',G.c.ownerUid,'onlineOrders',oid),{customerName:n.slice(0,80),customerPhone:p.slice(0,20),customerAddress:a.slice(0,400),
items:t.it.map(([i,q])=>({productId:i.id,name:String(i.name).slice(0,120),qty:q,rate:+(i.price*(G.c.gst?1+(i.gst||0)/100:1)).toFixed(2),gst:i.gst||0})),
subtotal:Math.round(t.sub),discount:Math.round(t.ds||0),couponCode:t.ds?String(window.cpn||'').slice(0,30):'',gst:Math.round(t.gst||0),total:t.total,
status:'pending',paymentMethod:'cod',source:'catalog',catalogId:G.c.id,customerUid:sa.currentUser.uid,createdAt:Date.now()});saved=true}catch(e){console.warn('order save failed',e)}
let m;
if(saved){m=`*New order #${oid}* — ${bn}\n\n${qty} item${qty>1?'s':''} · *Total: ${inr(t.total)}*\n\nName: ${n}\nPhone: ${p}\nAddress: ${a}\n\nOrder audit karne ke liye kholein:\n${erp}`;cart={};cs();cb();cm();toast('Order #'+oid+' bhej diya ✓')}
else{/* fallback: never lose an order - send the full item list on WhatsApp */
m=`*New order — ${bn}*\n\n`+t.it.map(([i,q],k)=>`${k+1}. ${i.name} × ${q} = ${inr(i.price*q)}`).join('\n')+`\n\nSubtotal: ${inr(t.sub)}`+(t.ds?`\nCoupon (${cpn}): -${inr(t.ds)}`:'')+(t.gst?`\nGST: ${inr(t.gst)}`:'')+`\n*Total: ${inr(t.total)}*\n\nName: ${n}\nPhone: ${p}\nAddress: ${a}\n\nOrder audit karne ke liye kholein:\n${erp}`;toast('Online save nahi hua, full message bhej rahe hain')}
order.busy=0;open('https://wa.me/'+w+'?text='+encodeURIComponent(m),'_blank')};
const pd=id=>{const i=G.items.find(x=>x.id==id),out=G.c.stock&&i.stock!=null&&i.stock<=0;$('#m').innerHTML=`<div class=modal onclick="if(event.target==this)cm()"><div class=sheet>${i.img?`<img src="${i.img}" style="width:100%;border-radius:14px;max-height:320px;object-fit:cover">`:''}<h2 style="margin-top:10px">${esc(i.name)}</h2><small>${esc(i.cat)}</small><div class=pr style="font-size:24px">${inr(i.price)}${i.mrp>i.price?`<s>${inr(i.mrp)}</s>`:''}</div><p style="margin:8px 0;white-space:pre-line">${esc(i.desc)}</p><div class=row><button class=g onclick="spd('${id}')">Share</button>${out?'':`<button onclick="add('${id}');cm()">Add to cart</button>`}</div></div></div>`};
