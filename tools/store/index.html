<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f7a80"><title>Online Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#0f7a80;--ink:#10262a;--mut:#63777b;--bg:#f3f6f5;--cd:#fff;--ln:#e0e8e7;--ok:#16a34a;--er:#d64545}
[data-d]{--ink:#e6f1f0;--mut:#9ab0b3;--bg:#0c1719;--cd:#132326;--ln:#25393c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:0 0 calc(70px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3,.pr{font-family:'Bricolage Grotesque',Figtree,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--cd)}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--c);color:#fff;font-weight:700;transition:transform .12s}button:active{transform:scale(.95)}button.g{background:transparent;color:var(--c);border:1.5px solid var(--c)}
small{color:var(--mut);font-size:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.hero{padding:calc(14px + env(safe-area-inset-top)) 14px 18px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;border-radius:0 0 26px 26px}
.hero .lg{width:46px;height:46px;border-radius:13px;background:#fff;object-fit:contain;flex:none}.hero h1{font-size:22px;line-height:1.15}.hero small{color:#ffffffcc}
.sb{display:flex;gap:8px;align-items:center;margin-top:14px;background:#fff;color:#63777b;border-radius:14px;padding:12px 14px}.sb input{border:0;padding:0;background:none;color:#10262a;outline:0}
.ban{margin:12px 14px 0;border-radius:18px;width:calc(100% - 28px);max-height:160px;object-fit:cover}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:18px 14px 8px}.sec h2{font-size:18px}.sec a{color:var(--c);font-weight:700;font-size:13px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs>*{scroll-snap-align:start;flex:none}
.cp{border:1.5px dashed var(--c);border-radius:14px;padding:9px 13px;background:var(--cd);min-width:150px}.cp b{color:var(--c);font-family:'Bricolage Grotesque'}
.cat{width:84px;text-align:center;font-size:12px;font-weight:700}.cat i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 4px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,var(--cd));color:var(--c);font:800 24px 'Bricolage Grotesque';font-style:normal}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;position:sticky;top:0;z-index:4;background:var(--bg);scrollbar-width:none}.chips button{white-space:nowrap;background:var(--cd);color:var(--ink);border:1px solid var(--ln);padding:7px 14px;border-radius:99px}.chips button.on{background:var(--c);color:#fff;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}body{max-width:980px;margin:auto}}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;animation:up .35s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.im{aspect-ratio:1;background:color-mix(in srgb,var(--c) 10%,var(--bg));display:grid;place-items:center;position:relative}.im img{width:100%;height:100%;object-fit:cover}.im>i{font:800 42px 'Bricolage Grotesque';color:var(--c);font-style:normal}
.of{position:absolute;left:8px;top:8px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.hb{position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;border-radius:50%;background:#fffe;color:var(--er);font-size:17px}.hb.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.4)}}
.b2{padding:9px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}.b2 h3{font-size:14px;line-height:1.25}.pr{font-size:17px;font-weight:800}.pr s{font:400 12px Figtree;color:var(--mut);margin-left:6px}
.ad{margin-top:8px;padding:8px}.qs{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:color-mix(in srgb,var(--c) 12%,var(--cd));border-radius:12px;padding:3px}.qs button{width:34px;padding:6px 0;border-radius:9px}.qs b{min-width:24px;text-align:center}
.out{opacity:.55}.lo{color:#d97706}.em{text-align:center;padding:50px 20px;color:var(--mut)}
.sk{height:210px;border-radius:16px;background:linear-gradient(90deg,var(--ln),var(--cd),var(--ln));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:8}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:11px;padding:8px 2px;position:relative}nav button.on{color:var(--c)}nav b{display:block;font-size:20px;transition:transform .2s}nav button.on b{transform:translateY(-2px) scale(1.15)}
nav em{position:absolute;top:2px;left:55%;min-width:18px;height:18px;border-radius:9px;background:var(--er);color:#fff;font:700 11px/18px Figtree;font-style:normal;text-align:center}nav em.bump{animation:pop .35s}
.md{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}@keyframes fd{from{opacity:0}}
.sheet{background:var(--cd);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:sl .28s cubic-bezier(.2,.8,.2,1)}@keyframes sl{from{transform:translateY(100%)}}
.gr{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.rw{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px;background:var(--er)}.rw>div{display:flex;gap:10px;align-items:center;padding:10px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;transition:transform .2s}
.rw img,.rw i{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--bg);color:var(--c);font:800 20px Figtree;font-style:normal}.rw .x{flex:1;min-width:0}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:0 14px 12px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,var(--cd));color:var(--c)}
.stp{display:flex;margin:10px 0 2px}.stp span{flex:1;text-align:center;font-size:10px;color:var(--mut);border-top:4px solid var(--ln);padding-top:4px}.stp span.on{border-color:var(--c);color:var(--c);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#10262a;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}
.cbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;display:none;justify-content:space-between;padding:13px 16px;box-shadow:0 8px 24px #0004}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="sh"></div><div id="toast"></div>
<nav id="nav"></nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,getDocs,collection}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
const CFG={apiKey:"AIzaSyCV3G-BMVf2QRpibaS5MnwQybKixC4h9og",authDomain:"dev-ayurveda.firebaseapp.com",projectId:"dev-ayurveda",storageBucket:"dev-ayurveda.firebasestorage.app",messagingSenderId:"40760282698",appId:"1:40760282698:web:20e31100eed712631ca0b3"};
const APP=typeof __app_id!=='undefined'?__app_id:'dev-ayurveda-pro-auth';
const PUSH_URL='https://erp-push-server.vercel.app/api/send-push'; // <-- apna Vercel URL yahan daalo
const fb=initializeApp(CFG),db=getFirestore(fb);
let _sa=null;const storeFb=async()=>{if(!_sa){const a=initializeApp(CFG,'store');_sa={auth:getAuth(a),db:getFirestore(a)}}if(!_sa.auth.currentUser)await signInAnonymously(_sa.auth);return _sa};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n||12)}catch{}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)};
const uid=new URLSearchParams(location.search).get('s'),KEY=k=>k+'_'+uid;
const ls=(k,d)=>{try{return JSON.parse(localStorage[KEY(k)]||'')}catch{return d}},sv=(k,v)=>{try{localStorage[KEY(k)]=JSON.stringify(v)}catch{}};
let G={c:{},items:[],cats:[]},cart=ls('cart',{}),W=new Set(ls('wl',[])),T='home',Q='',CAT='',SORT='feat',CP=null,ORD=ls('ord',[]);
const NAV=[['home','🏠','Home'],['shop','🛍️','Shop'],['cart','🛒','Cart'],['ord','📦','Orders'],['me','♥','Saved']];
const gi=id=>G.items.find(i=>i.id===id),offp=i=>i.mrp>i.price?Math.round(100-i.price*100/i.mrp):0,isOut=i=>i.stock!=null&&i.stock<=0;
/* ---- coupons: percent/flat, cap, min order, dates, usage limit ---- */
const cpCheck=(code,sub)=>{const c=(G.c.cpns||[]).find(x=>x.code===String(code).trim().toUpperCase());if(!c)return{err:'Ye coupon code sahi nahi hai'};const n=Date.now();
if(c.from&&n<new Date(c.from))return{err:'Ye coupon abhi shuru nahi hua'};if(c.exp&&n>new Date(c.exp+'T23:59:59'))return{err:'Ye coupon expire ho chuka hai'};
if(c.limit&&(c.used||0)>=c.limit)return{err:'Is coupon ki limit poori ho chuki hai'};if(c.min&&sub<c.min)return{err:'Is coupon ke liye '+inr(c.min)+' ka order chahiye'};
let d=c.type==='flat'?+c.value:sub*(+c.value)/100;if(c.max&&c.type!=='flat')d=Math.min(d,+c.max);return{c,d:Math.min(Math.round(d),sub)}};
const tot=()=>{const it=Object.entries(cart).map(([id,q])=>[gi(id),q]).filter(x=>x[0]);let sub=0,g=0;it.forEach(([i,q])=>{sub+=i.price*q;g+=i.price*q*(i.gst||0)/100});
let r=CP?cpCheck(CP,sub):null;if(r&&r.err)r=null;const ds=r?r.d:0,gs=sub?g*(1-ds/sub):0;const dl=sub&&G.c.dc&&!(G.c.fda&&sub-ds>=G.c.fda)?G.c.dc:0;return{it,sub,ds,gst:Math.round(gs),dl,total:Math.round(sub-ds+gs+dl),n:it.reduce((a,[,q])=>a+q,0)}};
const saveCart=()=>{sv('cart',cart);nav()};
/* ---- views ---- */
const card=(i,k)=>{const o=offp(i),q=cart[i.id]||0,out=isOut(i);return`<article class="cd${out?' out':''}" style="animation-delay:${Math.min(k,8)*40}ms" onclick="pd('${i.id}')"><div class=im>${i.img?`<img loading=lazy src="${esc(i.img)}" alt="">`:`<i>${esc((i.name||'?')[0])}</i>`}${o?`<b class=of>${o}% off</b>`:''}<button class=hb id="h${i.id}" onclick="event.stopPropagation();wl('${i.id}')">${W.has(i.id)?'♥':'♡'}</button></div><div class=b2><h3>${esc(i.name)}</h3><small>${esc(i.cat)}</small><div class=pr>${inr(i.price)}${o?`<s>${inr(i.mrp)}</s>`:''}</div>${!out&&i.stock!=null&&i.stock<=5?`<small class=lo>Sirf ${i.stock} bache</small>`:''}${out?'<small>Out of stock</small>':q?`<div class=qs onclick="event.stopPropagation()"><button onclick="qt('${i.id}',-1)">−</button><b>${q}</b><button onclick="qt('${i.id}',1)">+</button></div>`:`<button class=ad onclick="event.stopPropagation();qt('${i.id}',1)">Add</button>`}</div></article>`};
const list=()=>{const q=Q.toLowerCase();let a=G.items.filter(i=>(CAT==='__w'?W.has(i.id):!CAT||i.cat===CAT)&&(!q||(i.name+' '+i.cat).toLowerCase().includes(q)));
a.sort((x,y)=>SORT=='lo'?x.price-y.price:SORT=='hi'?y.price-x.price:SORT=='az'?x.name.localeCompare(y.name):SORT=='off'?offp(y)-offp(x):(y.feat||0)-(x.feat||0));return a};
const home=()=>{const c=G.c,b=c.biz||{};return`<div class=hero><div class=row style="gap:10px"><img class=lg src="${esc(b.logo||'')}" onerror="this.style.display='none'"><div style="flex:1"><h1>${esc(b.name||c.title||'Store')}</h1><small>${esc(c.tag||'Ghar baithe order karein')}</small></div><button class=g style="flex:none;color:#fff;border-color:#fff8;padding:8px 12px" onclick="dk()">◐</button></div><div class=sb onclick="go('shop',1)">🔍<input placeholder="Search ${G.items.length} products…" readonly></div></div>
${c.closed?`<div class=box style="margin-top:12px;background:#fdecec;color:#b71c1c"><b>${esc(c.closed)}</b></div>`:''}${c.banner?`<img class=ban src="${esc(c.banner)}" alt="">`:''}
${(c.cpns||[]).length?`<div class=sec><h2>Offers</h2></div><div class=hs>${c.cpns.map(x=>`<div class=cp onclick="cpy('${esc(x.code)}')"><b>${esc(x.code)}</b><br><small>${x.type==='flat'?inr(x.value)+' off':x.value+'% off'}${x.min?' · min '+inr(x.min):''}<br>${esc(x.desc||'Tap karke copy karein')}</small></div>`).join('')}</div>`:''}
<div class=sec><h2>Categories</h2><a onclick="go('shop',1)">Sab dekhein</a></div><div class=hs>${G.cats.map(x=>`<div class=cat onclick="CAT='${esc(x)}';go('shop')"><i>${esc(x[0])}</i>${esc(x)}</div>`).join('')}</div>
<div class=sec><h2>${G.items.some(i=>i.feat)?'Featured':'Popular'}</h2></div><div class=grid>${[...G.items].sort((a,b)=>(b.feat||0)-(a.feat||0)).slice(0,6).map(card).join('')}</div>
<div class=sec><h2>Best offers</h2></div><div class=grid>${[...G.items].filter(offp).sort((a,b)=>offp(b)-offp(a)).slice(0,4).map(card).join('')||'<p class=em style="grid-column:1/-1">Abhi koi offer nahi</p>'}</div>`};
const shop=()=>`<div style="padding:calc(10px + env(safe-area-inset-top)) 14px 0"><input id=q placeholder="Search products…" value="${esc(Q)}" oninput="Q=this.value;gl()"></div><div class=chips><button class="${!CAT?'on':''}" onclick="CAT='';shopR()">All</button><button class="${CAT=='__w'?'on':''}" onclick="CAT='__w';shopR()">♥ Saved</button>${G.cats.map(x=>`<button class="${CAT==x?'on':''}" onclick="CAT=this.textContent;shopR()">${esc(x)}</button>`).join('')}</div>
<div class=row style="padding:0 14px 10px"><small id=cnt></small><select style="width:auto;flex:none" onchange="SORT=this.value;gl()">${[['feat','Featured'],['lo','Price ↑'],['hi','Price ↓'],['off','Best discount'],['az','A–Z']].map(o=>`<option value=${o[0]} ${SORT==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div id=gl class=grid></div>`;
const gl=()=>{const a=list();$('#cnt').textContent=a.length+' products';$('#gl').innerHTML=a.map(card).join('')||'<p class=em style="grid-column:1/-1">Koi product nahi mila</p>'};
const shopR=()=>{const y=scrollY;render();scrollTo(0,y)};
const cartV=()=>{const t=tot();if(!t.n)return`<div class=em style="padding-top:calc(80px + env(safe-area-inset-top))"><div style="font-size:54px">🛒</div><h2>Cart khali hai</h2><p style="margin:6px 0 16px">Pasand ke products add karein</p><button onclick="go('shop')">Shopping shuru karein</button></div>`;
const av=(G.c.cpns||[]).filter(x=>!cpCheck(x.code,t.sub).err);
return`<div style="padding:calc(14px + env(safe-area-inset-top)) 14px 0"><h2>Your cart <small>(swipe left = remove)</small></h2></div><div style="padding:10px 14px 0">${t.it.map(([i,q])=>`<div class=rw id="r${i.id}"><div ontouchstart="sw(event,'${i.id}')" ontouchmove="sw(event)" ontouchend="sw(event)">${i.img?`<img src="${esc(i.img)}">`:`<i>${esc(i.name[0])}</i>`}<div class=x><h3 style="font-size:14px">${esc(i.name)}</h3><small>${inr(i.price)} each</small></div><div class=qs style="margin:0;flex:none"><button onclick="qt('${i.id}',-1)">−</button><b>${q}</b><button onclick="qt('${i.id}',1)">+</button></div></div></div>`).join('')}</div>
<div class=box><div class=row><input id=cc placeholder="Coupon code" value="${esc(CP||'')}" style="text-transform:uppercase"><button class=g style="flex:none" onclick="ap()">Apply</button></div>${av.length?`<div class=hs style="padding:8px 0 0">${av.map(x=>`<span class=tag onclick="$('#cc').value='${esc(x.code)}';ap()">${esc(x.code)} · save ${inr(cpCheck(x.code,t.sub).d)}</span>`).join('')}</div>`:''}</div>
<div class=box><div class=row><span>Subtotal</span><b style="text-align:right">${inr(t.sub)}</b></div>${t.ds?`<div class=row style="color:var(--ok)"><span>Coupon ${esc(CP)}</span><b style="text-align:right">−${inr(t.ds)}</b></div>`:''}${t.gst?`<div class=row><span>GST</span><b style="text-align:right">${inr(t.gst)}</b></div>`:''}${G.c.dc?`<div class=row><span>Delivery</span><b style="text-align:right">${t.dl?inr(t.dl):'Free'}</b></div>`:''}<div class=row style="margin-top:6px;font-size:18px"><b>Total</b><b class=pr style="text-align:right">${inr(t.total)}</b></div></div>
<div style="padding:0 14px"><button style="width:100%;padding:14px" onclick="co()">Checkout · ${inr(t.total)}</button></div>`};
const ST=['pending','confirmed','shipped','delivered'];
const ordV=()=>`<div style="padding:calc(14px + env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between"><h2>My orders</h2><button class=g style="padding:6px 12px" onclick="rf()">↻ Refresh</button></div>${ORD.map(o=>`<div class=box><div class=row><b>#${o.id}</b><span class=tag style="flex:none">${o.status=='rejected'?'Rejected':o.status}</span></div><small>${new Date(o.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${o.n} items</small><div class=pr>${inr(o.total)}</div>${o.status=='rejected'?'':`<div class=stp>${ST.map((s,k)=>`<span class="${k<=ST.indexOf(o.status)?'on':''}">${s}</span>`).join('')}</div>`}<div class=row style="margin-top:8px"><button class=g onclick="ro('${o.id}')">Reorder</button><button class=g onclick="open('https://wa.me/${(G.c.wa||'').replace(/\D/g,'')}?text='+encodeURIComponent('Order #${o.id} ka status?'))">Ask on WhatsApp</button></div></div>`).join('')||'<p class=em>Abhi tak koi order nahi</p>'}`;
const meV=()=>{const a=G.items.filter(i=>W.has(i.id)),b=G.c.biz||{};return`<div style="padding:calc(14px + env(safe-area-inset-top)) 14px 8px"><h2>Saved items</h2></div><div class=grid>${a.map(card).join('')||'<p class=em style="grid-column:1/-1">Dil ♡ dabakar products save karein</p>'}</div><div class=box style="margin-top:16px"><b>${esc(b.name||'')}</b><br><small>${esc(b.addr||'')}</small>${G.c.wa?`<br><button class=g style="margin-top:8px" onclick="open('https://wa.me/${G.c.wa.replace(/\D/g,'')}')">💬 Chat on WhatsApp</button>`:''}${G.c.minOrder?`<br><small>Minimum order ${inr(G.c.minOrder)}</small>`:''}</div>`};
const render=()=>{$('#app').innerHTML={home,shop,cart:cartV,ord:ordV,me:meV}[T]();if(T=='shop')gl();nav()};
const nav=()=>{const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#nav').innerHTML=NAV.map(t=>`<button class="${T==t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}${t[0]=='cart'&&n?`<em id=bd>${n}</em>`:''}</button>`).join('')};
const go=(t,f)=>{T=t;render();scrollTo(0,0);if(f)setTimeout(()=>$('#q')&&$('#q').focus(),50)};
/* ---- actions ---- */
const qt=(id,d)=>{const i=gi(id),q=(cart[id]||0)+d;if(d>0&&i.stock!=null&&q>i.stock)return toast('Sirf '+i.stock+' available hain');q<=0?delete cart[id]:cart[id]=q;vib();saveCart();T=='shop'?gl():render();if(d>0){const b=$('#bd');b&&(b.className='bump')}};
const wl=id=>{W.has(id)?W.delete(id):W.add(id);sv('wl',[...W]);vib(8);const b=$('#h'+id);if(b){b.textContent=W.has(id)?'♥':'♡';b.classList.add('pop')}};
const cpy=c=>{navigator.clipboard&&navigator.clipboard.writeText(c);CP=c;toast('Coupon '+c+' cart me lagega')};
const ap=()=>{const t=tot(),v=$('#cc').value.trim();if(!v){CP=null;return render()}const r=cpCheck(v,t.sub);if(r.err){toast(r.err);vib([20,40,20]);return}CP=v.toUpperCase();toast('🎉 '+inr(r.d)+' bach gaye!');render()};
const dk=()=>{try{localStorage.dk=document.documentElement.toggleAttribute('data-d')?1:''}catch{}};
const closeS=()=>$('#sh').innerHTML='';
const sheet=h=>{$('#sh').innerHTML=`<div class=md onclick="if(event.target==this)closeS()"><div class=sheet id=shs><div class=gr id=grp></div>${h}</div></div>`;const s=$('#shs'),g=$('#grp');let y0=0,dy=0;
g.ontouchstart=e=>{y0=e.touches[0].clientY};g.ontouchmove=e=>{dy=Math.max(0,e.touches[0].clientY-y0);s.style.transform=`translateY(${dy}px)`;s.style.animation='none'};g.ontouchend=()=>{dy>90?closeS():s.style.transform='';dy=0}};
const pd=id=>{const i=gi(id),o=offp(i),rel=G.items.filter(x=>x.cat==i.cat&&x.id!=id).slice(0,6);sheet(`${i.img?`<img src="${esc(i.img)}" style="width:100%;border-radius:16px;max-height:320px;object-fit:cover">`:''}<h2 style="margin-top:10px">${esc(i.name)}</h2><small>${esc(i.cat)}${i.hsn?' · HSN '+esc(i.hsn):''}</small><div class=pr style="font-size:26px">${inr(i.price)}${o?`<s>${inr(i.mrp)}</s> <span class=tag>${o}% off</span>`:''}</div>${i.gst?`<small>+${i.gst}% GST</small>`:''}<p style="margin:10px 0;white-space:pre-line">${esc(i.desc||'')}</p><div class=row><button class=g onclick="shr('${id}')">Share</button>${isOut(i)?'<button disabled style="opacity:.5">Out of stock</button>':`<button onclick="qt('${id}',1);closeS()">Add to cart</button>`}</div>${rel.length?`<div class=sec style="padding:16px 0 8px"><h2 style="font-size:16px">Aur bhi dekhein</h2></div><div class=hs style="padding:0">${rel.map(x=>`<div style="width:130px" onclick="pd('${x.id}')"><div class=im style="border-radius:12px;overflow:hidden">${x.img?`<img src="${esc(x.img)}">`:`<i>${esc(x.name[0])}</i>`}</div><small>${esc(x.name)}</small><br><b>${inr(x.price)}</b></div>`).join('')}</div>`:''}`)};
const shr=id=>{const u=location.origin+location.pathname+'?s='+uid+'&p='+id;navigator.share?navigator.share({title:gi(id).name,url:u}).catch(()=>{}):(navigator.clipboard.writeText(u),toast('Link copied'))};
let sx=0,sr=null;const sw=(e,id)=>{const el=e.currentTarget,t=e.touches[0]||e.changedTouches[0];if(e.type=='touchstart'){sx=t.clientX;sr=id}else if(e.type=='touchmove'){el.style.transform=`translateX(${Math.min(0,t.clientX-sx)}px)`}else{const dx=t.clientX-sx;if(dx<-90){el.style.transform='translateX(-110%)';vib(20);setTimeout(()=>{delete cart[sr];saveCart();render()},180)}else el.style.transform=''}};
const co=()=>{const t=tot(),u=ls('cust',{}),c=G.c;if(c.closed)return toast(c.closed);if(c.minOrder&&t.sub<c.minOrder)return toast('Minimum order '+inr(c.minOrder)+' hai');
sheet(`<h2>Delivery details</h2><label><small>Name</small></label><input id=cnm value="${esc(u.n||'')}"><label><small>Phone</small></label><input id=cph type=tel value="${esc(u.p||'')}"><label><small>Address</small></label><textarea id=cad rows=2>${esc(u.a||'')}</textarea><label><small>Payment</small></label><select id=cpm>${c.cod!==0?'<option value=cod>Cash on Delivery</option>':''}${c.upi?'<option value=upi>UPI (order ke baad)</option>':''}</select><h2 style="margin:12px 0">Total ${inr(t.total)}</h2><button style="width:100%;padding:14px" onclick="order()">Place order on WhatsApp</button>`)};
const order=async()=>{if(order.busy)return;const t=tot(),n=$('#cnm').value.trim(),p=$('#cph').value.trim(),a=$('#cad').value.trim(),pm=$('#cpm').value,c=G.c;
if(!n||!p||!a)return toast('Naam, phone aur address daalein');if(p.replace(/\D/g,'').length<10)return toast('Sahi phone number daalein');if(!t.it.length)return toast('Cart khali hai');
const w=(c.wa||'').replace(/\D/g,'');if(!w)return toast('Seller ka WhatsApp number set nahi hai');
if(CP){const r=cpCheck(CP,t.sub);if(r.err){CP=null;return toast(r.err)}}
sv('cust',{n,p,a});order.busy=1;toast('Order save ho raha hai…');
const oid='WO'+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(2,4).toUpperCase(),bn=(c.biz||{}).name||c.title,erp=location.origin+location.pathname.replace(/tools\/store\/?(index\.html)?$/,'')+'?action=web-orders';let saved=false;
try{const s=await storeFb();await setDoc(doc(s.db,'artifacts',APP,'users',c.ownerUid,'onlineOrders',oid),{customerName:n.slice(0,80),customerPhone:p.slice(0,20),customerAddress:a.slice(0,400),
items:t.it.map(([i,q])=>({productId:i.id,name:String(i.name).slice(0,120),qty:q,rate:+(i.price*(1+(i.gst||0)/100)).toFixed(2),gst:i.gst||0})),subtotal:Math.round(t.sub),discount:t.ds,couponCode:t.ds?CP:'',gst:t.gst,total:t.total,status:'pending',paymentMethod:pm,source:'catalog',catalogId:'store_'+c.ownerUid,customerUid:s.auth.currentUser.uid,createdAt:Date.now()});saved=true}catch(e){console.warn(e)}
if(saved&&PUSH_URL.indexOf('YOUR-PROJECT')<0){try{fetch(PUSH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:c.ownerUid,orderId:oid}),keepalive:true}).catch(()=>{})}catch(e){}}
let m=saved?`*New order #${oid}* — ${bn}\n\n${t.n} items · *Total: ${inr(t.total)}*\n\nName: ${n}\nPhone: ${p}\nAddress: ${a}\nPayment: ${pm.toUpperCase()}${t.ds?`\nCoupon: ${CP}`:''}\n\nOrder audit karne ke liye kholein:\n${erp}`:`*New order — ${bn}*\n\n`+t.it.map(([i,q],k)=>`${k+1}. ${i.name} × ${q} = ${inr(i.price*q)}`).join('\n')+`\n\nSubtotal: ${inr(t.sub)}${t.ds?`\nCoupon (${CP}): -${inr(t.ds)}`:''}\n*Total: ${inr(t.total)}*\n\nName: ${n}\nPhone: ${p}\nAddress: ${a}\n\nOrder audit karne ke liye kholein:\n${erp}`;
if(saved){ORD.unshift({id:oid,t:Date.now(),n:t.n,total:t.total,status:'pending',items:Object.assign({},cart)});sv('ord',ORD)}
cart={};CP=null;sv('cart',cart);closeS();T='ord';render();order.busy=0;vib([30,50,30]);toast(saved?'Order #'+oid+' bhej diya ✓':'Message bhej rahe hain');open('https://wa.me/'+w+'?text='+encodeURIComponent(m),'_blank')};
const rf=async()=>{try{const s=await storeFb();for(const o of ORD.filter(o=>o.status!='delivered'&&o.status!='rejected')){const d=await getDoc(doc(s.db,'artifacts',APP,'users',G.c.ownerUid,'onlineOrders',o.id));if(d.exists())o.status=d.data().status||o.status}sv('ord',ORD);toast('Status update ho gaya')}catch{toast('Live status abhi nahi mil paya')}render()};
const ro=id=>{const o=ORD.find(x=>x.id==id);Object.entries(o.items||{}).forEach(([k,q])=>gi(k)&&(cart[k]=q));saveCart();go('cart')};
/* ---- boot ---- */
Object.assign(window,{$,go,qt,wl,cpy,ap,pd,shr,sw,co,order,rf,ro,dk,closeS,gl,shopR,render,list});
Object.defineProperties(window,{Q:{get:()=>Q,set:v=>{Q=v},configurable:true},CAT:{get:()=>CAT,set:v=>{CAT=v},configurable:true},SORT:{get:()=>SORT,set:v=>{SORT=v},configurable:true}});
if(localStorage.dk)document.documentElement.setAttribute('data-d','');
(async()=>{if(!uid){$('#app').innerHTML='<p class=em>Store link sahi nahi hai.</p>';return}
$('#app').innerHTML='<div class=grid style="padding-top:60px">'+'<div class=sk></div>'.repeat(4)+'</div>';nav();
try{const s=await getDoc(doc(db,'artifacts',APP,'catalogs','store_'+uid));if(!s.exists())return $('#app').innerHTML='<p class=em>Ye store abhi live nahi hai.</p>';
const it=await getDocs(collection(db,'artifacts',APP,'catalogs','store_'+uid,'items'));G.c={...s.data(),ownerUid:s.data().ownerUid||uid};G.items=it.docs.map(d=>d.data());G.cats=[...new Set(G.items.map(i=>i.cat).filter(Boolean))].sort();
document.title=(G.c.biz&&G.c.biz.name||G.c.title||'Store');document.documentElement.style.setProperty('--c',G.c.color||'#0f7a80');
Object.keys(cart).forEach(k=>gi(k)||delete cart[k]);render();const p=new URLSearchParams(location.search).get('p');if(p&&gi(p))pd(p)}
catch(e){$('#app').innerHTML=`<p class=em>Store load nahi hua (${esc(e.message)})</p>`}})();
</script></body></html>
